server {
    listen 80;
    server_name your_domain_or_ip; # Buraya domain adresinizi veya IP adresinizi yazın

    # Web admin build dosyalarının yolu
    root /var/www/visitor-app/web-admin/dist;
    index index.html;

    # Frontend route'ları için (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api {
        proxy_pass http://localhost:5000; # Backend'in çalıştığı port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
